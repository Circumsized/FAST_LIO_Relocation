# FAST_LIO_Relocation ROS2 (Humble) — MID360 建图配置
/**:
  ros__parameters:
    run_mode: 0  # 0=建图(MODE_MAPPING)

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      gravity_align_en: true
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360
      det_range: 100.0
      extrinsic_est_en: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1, 0, 0,
                    0, 1, 0,
                    0, 0, 1]

    feature_extract_enable: false
    point_filter_num: 3
    max_iteration: 3
    filter_size_corner: 0.3
    filter_size_surf: 0.3
    filter_size_map: 0.3
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    world_frame: "camera_init"

    localization:
      min_effective_points_for_tracking: 15
      max_residual_for_tracking: 0.1
      min_effective_points_for_good: 180
      max_residual_for_good: 0.08
      unlock_to_tracking_streak: 3
      good_match_streak_to_lock: 20
      bad_match_streak_to_lost: 5
      min_time_before_lock_sec: 1.0
      max_position_jump_for_update_locked: 0.5
      adaptive_gating_en: false
      adaptive_scale_max: 3.0
      lost_recovery_en: false
      lost_recovery_streak: 10
      lost_recovery_max_attempts: 3
      lost_recovery_cooldown_sec: 5.0
      prior_map_pub_interval: 50

    publish:
      path_en: false
      path_min_distance: 0.05
      path_max_length: 10000
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true
      interval: -1
