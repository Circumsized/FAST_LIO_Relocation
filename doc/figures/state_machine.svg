<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
      <path d="M0,0 L8.5,3 L0,6 z" fill="#455a64"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto">
      <path d="M0,0 L8.5,3 L0,6 z" fill="#c62828"/>
    </marker>
    <style>
      .n { stroke-width:2; fill:#ffffff; }
      .t { font-size:15px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .e { stroke:#455a64; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .r { stroke:#c62828; stroke-width:1.6; fill:none; marker-end:url(#ao); stroke-dasharray:6 4; }
      .el { font-size:11.5px; fill:#37474f; text-anchor:middle; }
      .rl { font-size:11.5px; fill:#c62828; text-anchor:middle; }
    </style>
  </defs>

  <text x="450" y="30" font-size="19" font-weight="700" fill="#263238" text-anchor="middle">图 2  定位状态机</text>

  <!-- nodes -->
  <ellipse class="n" cx="90" cy="140" rx="58" ry="30" stroke="#607d8b"/>
  <text class="t" x="90" y="140" fill="#37474f">启动</text>

  <rect class="n" x="180" y="106" width="150" height="68" rx="10" stroke="#0277bd"/>
  <text class="t" x="255" y="133" fill="#01579b">UNLOCKED</text>
  <text class="el" x="255" y="156">初始化</text>

  <rect class="n" x="375" y="106" width="150" height="68" rx="10" stroke="#ef6c00"/>
  <text class="t" x="450" y="133" fill="#e65100">TRACKING</text>
  <text class="el" x="450" y="156">可用不稳定</text>

  <rect class="n" x="570" y="106" width="150" height="68" rx="10" stroke="#2e7d32"/>
  <text class="t" x="645" y="133" fill="#1b5e20">LOCKED</text>
  <text class="el" x="645" y="156">稳定可靠</text>

  <rect class="n" x="375" y="330" width="150" height="68" rx="10" stroke="#c62828"/>
  <text class="t" x="450" y="357" fill="#b71c1c">LOST</text>
  <text class="el" x="450" y="380">失效冻结</text>

  <!-- forward edges -->
  <path class="e" d="M148,140 L180,140"/>
  <path class="e" d="M330,140 L375,140"/>
  <text class="el" x="352" y="128">连续可接受</text>
  <path class="e" d="M525,140 L570,140"/>
  <text class="el" x="547" y="128">连续良好</text>

  <!-- LOST edges -->
  <path class="r" d="M450,174 L450,330"/>
  <text class="rl" x="512" y="252">连续劣化</text>

  <!-- recovery edge -->
  <path class="e" d="M375,364 L255,364 L255,174"/>
  <text class="el" x="300" y="388">可选恢复</text>

  <!-- lock drop to tracking -->
  <path class="e" d="M600,174 L600,214 L525,214 L525,150" stroke-dasharray="0"/>
  <text class="el" x="660" y="210">质量下降回落</text>

  <!-- self loops -->
  <path class="e" d="M450,106 C450,86 480,86 480,106"/>
  <path class="e" d="M645,106 C645,86 675,86 675,106"/>
  <text class="el" x="720" y="96">维持</text>

  <text x="450" y="470" font-size="11.5" fill="#607d8b" text-anchor="middle">实线：正常转移　　虚线红线：进入 LOST　　灰色注释：可选恢复路径（默认关闭）</text>
</svg>
